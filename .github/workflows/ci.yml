name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ci-placeholder-key-0000000000
      SESSION_SECRET: ci-placeholder-session-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Typecheck (worker)
        run: npm run typecheck:worker

      - name: Test
        run: npm run test

      - name: Build (web)
        run: npm run build

      - name: Build (worker)
        run: npm run build:worker
