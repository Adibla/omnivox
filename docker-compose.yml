name: omnivox

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnivox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnivox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnivox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: omnivox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: omnivox-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-omnivox.json:/opt/keycloak/data/import/realm-omnivox.json:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: omnivox-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: omnivox-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/cors.json:/tmp/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/omnivox &&
      mc cors set local/omnivox /tmp/cors.json
      "

  # --- application (opt-in) ---------------------------------------------------
  # `docker compose --profile app up -d --build` runs the full stack, including
  # web and worker, with no local Node.js required. Set OPENAI_API_KEY and
  # SESSION_SECRET in a root `.env` file first (see `.env.example`).

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: omnivox-migrate
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/omnivox
    working_dir: /app
    command: ["node", "scripts/migrate.mjs"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: omnivox-web
    profiles: ["app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/omnivox
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Presigned URLs are opened by the browser, so they are signed against
      # the host-published MinIO port, not the internal service name.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in a root .env file}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in a root .env file}
      AUTH_MODE: disabled
      APP_BASE_URL: http://localhost:3000
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: omnivox-worker
    profiles: ["app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4010:4010"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/omnivox
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in a root .env file}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
